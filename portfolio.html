<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honoured One</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2c3e50);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .profile-container {
            background: rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 15px;
            width: 320px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
        }

        h1 {
            margin: 15px 0 5px;
        }

        .links a {
            display: block;
            margin: 8px 0;
            padding: 10px;
            text-decoration: none;
            background: white;
            color: #2c3e50;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .links a:hover {
            background: #f1c40f;
            color: black;
        }

        .quote {
            margin-top: 20px;
            font-style: italic;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="profile-container">
        <img src="images.jpeg" alt="Profile Picture" class="profile-pic">

        <h1>Manav Renjith</h1>

        <div class="links">
            <p>Connect with me:</p>
            <a href="https://www.linkedin.com/in/manav-renjith-1207a337b/">LinkedIn</a>
            <a href="https://github.com/manavrenjith">GitHub</a>
            <a href="projects.html">Projects</a>
        </div>

        <p class="quote">
            "Throughout heaven and earth, I alone am the honoured one."
        </p>
    </div>
</body>
</html>
