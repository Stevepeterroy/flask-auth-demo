<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Signup</h2>

        <form onsubmit="handleSignup(event)">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_]+" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" minlength="12" maxlength="128" required>
            </div>

            <button type="submit">Register</button>
        </form>

        <div id="message" role="status" aria-live="polite" class="message"></div>

        <p style="text-align: center;">
            Already have an account? <a href="login.html">Login</a>
        </p>
    </div>

    <script src="auth.js"></script>
</body>
</html>
